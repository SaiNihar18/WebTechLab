<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Drag & Drop - HTML5</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #0f0f1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Trebuchet MS', sans-serif;
      color: #eee;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
      color: #f0d080;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    p.subtitle {
      color: #888;
      margin-bottom: 40px;
      font-size: 0.9rem;
    }

    .workspace {
      display: flex;
      gap: 40px;
      align-items: flex-start;
    }

    /* ── Draggable items panel ── */
    .items-panel {
      background: #1c1c30;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
      width: 180px;
    }

    .items-panel h2 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #aaa;
      margin-bottom: 14px;
    }

    .drag-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #2a2a45;
      border: 2px solid #444;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 10px;
      cursor: grab;
      user-select: none;
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .drag-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      border-color: #f0d080;
    }

    .drag-item.dragging {
      opacity: 0.4;
      cursor: grabbing;
    }

    .drag-item .icon { font-size: 1.2rem; }

    /* ── Drop zones ── */
    .zones-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .drop-zone {
      width: 220px;
      min-height: 180px;
      background: #1c1c30;
      border: 2px dashed #444;
      border-radius: 12px;
      padding: 14px;
      transition: background 0.2s, border-color 0.2s;
      position: relative;
    }

    .drop-zone h3 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #888;
      margin-bottom: 10px;
    }

    .drop-zone.drag-over {
      background: #252545;
      border-color: #f0d080;
      box-shadow: 0 0 20px rgba(240,208,128,0.15);
    }

    .drop-zone .placeholder {
      color: #555;
      font-size: 0.8rem;
      text-align: center;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      white-space: nowrap;
    }

    /* Dropped item inside zone */
    .drop-zone .drag-item {
      margin-bottom: 8px;
      background: #30305a;
      border-color: #666;
      font-size: 0.82rem;
      padding: 10px 12px;
    }

    /* Zone color accents */
    .drop-zone:nth-child(1) { border-color: #c0392b55; }
    .drop-zone:nth-child(1).drag-over { border-color: #e74c3c; background: #2a1a1a; box-shadow: 0 0 20px rgba(231,76,60,0.15); }
    .drop-zone:nth-child(2) { border-color: #27ae6055; }
    .drop-zone:nth-child(2).drag-over { border-color: #2ecc71; background: #1a2a1a; box-shadow: 0 0 20px rgba(46,204,113,0.15); }
    .drop-zone:nth-child(3) { border-color: #2980b955; }
    .drop-zone:nth-child(3).drag-over { border-color: #3498db; background: #1a1a2a; box-shadow: 0 0 20px rgba(52,152,219,0.15); }
    .drop-zone:nth-child(4) { border-color: #8e44ad55; }
    .drop-zone:nth-child(4).drag-over { border-color: #9b59b6; background: #1f1a2a; box-shadow: 0 0 20px rgba(155,89,182,0.15); }

    .zone-label {
      display: inline-block;
      font-size: 0.65rem;
      border-radius: 4px;
      padding: 2px 8px;
      margin-bottom: 10px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .drop-zone:nth-child(1) .zone-label { background: #c0392b33; color: #e74c3c; }
    .drop-zone:nth-child(2) .zone-label { background: #27ae6033; color: #2ecc71; }
    .drop-zone:nth-child(3) .zone-label { background: #2980b933; color: #3498db; }
    .drop-zone:nth-child(4) .zone-label { background: #8e44ad33; color: #9b59b6; }

    /* Reset button */
    .reset-btn {
      margin-top: 30px;
      padding: 10px 28px;
      background: transparent;
      border: 1.5px solid #f0d080;
      color: #f0d080;
      border-radius: 30px;
      cursor: pointer;
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: background 0.2s, color 0.2s;
    }
    .reset-btn:hover { background: #f0d080; color: #0f0f1a; }

    .status-msg {
      margin-top: 14px;
      font-size: 0.8rem;
      color: #aaa;
      letter-spacing: 1px;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <h1>HTML5 Drag &amp; Drop</h1>
  <p class="subtitle">Drag items from the left panel into any drop zone</p>

  <div class="workspace">
    <!-- Source items -->
    <div class="items-panel">
      <h2>Items</h2>
      <div class="drag-item" draggable="true" data-id="1"><span class="icon">🔴</span> Task A</div>
      <div class="drag-item" draggable="true" data-id="2"><span class="icon">🟢</span> Task B</div>
      <div class="drag-item" draggable="true" data-id="3"><span class="icon">🔵</span> Task C</div>
      <div class="drag-item" draggable="true" data-id="4"><span class="icon">🟣</span> Task D</div>
      <div class="drag-item" draggable="true" data-id="5"><span class="icon">🟡</span> Task E</div>
    </div>

    <!-- Drop zones -->
    <div class="zones-panel">
      <div class="drop-zone" id="zone1">
        <span class="zone-label">Zone 1</span>
        <h3>To Do</h3>
        <span class="placeholder">Drop here</span>
      </div>
      <div class="drop-zone" id="zone2">
        <span class="zone-label">Zone 2</span>
        <h3>In Progress</h3>
        <span class="placeholder">Drop here</span>
      </div>
      <div class="drop-zone" id="zone3">
        <span class="zone-label">Zone 3</span>
        <h3>Review</h3>
        <span class="placeholder">Drop here</span>
      </div>
      <div class="drop-zone" id="zone4">
        <span class="zone-label">Zone 4</span>
        <h3>Done</h3>
        <span class="placeholder">Drop here</span>
      </div>
    </div>
  </div>

  <div class="status-msg" id="statusMsg">Ready — drag an item to begin.</div>
  <button class="reset-btn" onclick="resetAll()">↺ Reset</button>

  <script>
    let draggedEl = null;
    const statusMsg = document.getElementById('statusMsg');

    // ── Drag events on items ──
    document.querySelectorAll('.drag-item').forEach(item => {
      item.addEventListener('dragstart', e => {
        draggedEl = item;
        item.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', item.dataset.id);
        statusMsg.textContent = `Dragging: ${item.innerText.trim()}`;
      });

      item.addEventListener('dragend', () => {
        if (draggedEl) draggedEl.classList.remove('dragging');
        draggedEl = null;
        document.querySelectorAll('.drop-zone').forEach(z => z.classList.remove('drag-over'));
      });
    });

    // ── Drop zone events ──
    document.querySelectorAll('.drop-zone').forEach(zone => {
      zone.addEventListener('dragover', e => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        zone.classList.add('drag-over');
      });

      zone.addEventListener('dragleave', e => {
        if (!zone.contains(e.relatedTarget)) {
          zone.classList.remove('drag-over');
        }
      });

      zone.addEventListener('drop', e => {
        e.preventDefault();
        zone.classList.remove('drag-over');

        if (draggedEl) {
          // Hide placeholder if present
          const placeholder = zone.querySelector('.placeholder');
          if (placeholder) placeholder.style.display = 'none';

          // Clone the item and append
          const clone = draggedEl.cloneNode(true);
          clone.classList.remove('dragging');
          clone.setAttribute('draggable', 'true');
          zone.appendChild(clone);

          // Make new clone draggable too
          attachDragEvents(clone);

          // Remove from original parent (or hide)
          draggedEl.remove();

          statusMsg.textContent = `✔ Dropped into ${zone.querySelector('h3').innerText}`;
        }
      });
    });

    function attachDragEvents(item) {
      item.addEventListener('dragstart', e => {
        draggedEl = item;
        item.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', item.dataset.id);
      });
      item.addEventListener('dragend', () => {
        if (draggedEl) draggedEl.classList.remove('dragging');
        draggedEl = null;
        document.querySelectorAll('.drop-zone').forEach(z => z.classList.remove('drag-over'));
      });
    }

    function resetAll() {
      location.reload();
    }
  </script>
</body>
</html>
